<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhammad Adilaga — Web & AI Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  /* ============ 1. TOKENS ============ */
  :root {
    --dark: #181818;
    --light: #f5f5f3;
    --ink: #181818;
    --red: #da291c;
    --cycle: 7s;            /* siklus outline↔fill */
    --pulse: 6s;            /* denyut glow */
    --speed: 38s;           /* kecepatan marquee */
    --mq-h: 3.2rem;
    --pad: 4vw;
    --cw: min(30vw, 40vh);   /* lebar karakter (kanan) */
    --ease: cubic-bezier(.16, 1, .3, 1);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }

  /* ============ 2. BASE ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
  html, body { height: 100%; }
  body { background: var(--dark); color: #fff; font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; outline: none; }
  input, textarea { cursor: text; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .app { position: fixed; inset: 0; overflow: hidden; }

  /* ============ 3. SPLIT PANELS + GLOW ============ */
  .panel { position: absolute; top: 0; bottom: 0; width: 50%; }
  .panel--l { left: 0; background: var(--dark); overflow: hidden; }
  .panel--r { right: 0; background: var(--light); }
  .glow {
    position: absolute; inset: -25% -30%;
    background: radial-gradient(ellipse 50% 45% at 45% 62%, rgba(218, 41, 28, .32), rgba(218, 41, 28, .1) 45%, transparent 70%);
    animation: glow var(--pulse) ease-in-out infinite;
  }
  @keyframes glow { 0%, 100% { opacity: .55; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.06); } }

  /* ============ 4. TOP BAR ============ */
  .top { position: absolute; z-index: 50; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 1.2rem var(--pad); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .logo { width: 2.8rem; height: 2.8rem; display: grid; place-items: center; font-weight: 900; font-size: .8rem; letter-spacing: .04em; transition: transform .4s var(--ease); }
  .logo.txt { background: var(--red); width: 2.4rem; height: 2.4rem; }
  .logo img { width: 100%; height: 100%; display: block; animation: spin 14s linear infinite; filter: drop-shadow(0 0 10px rgba(218, 41, 28, .75)); }
  .logo:hover { transform: scale(1.18); }
  @keyframes spin { to { rotate: 360deg; } }
  .nav { display: flex; gap: .6rem; align-items: center; }
  .nav-group { display: flex; background: #fff; border: 1px solid rgba(24, 24, 24, .18); }
  .nav button { padding: .7rem clamp(.6rem, 1vw, 1.05rem); font-weight: 700; font-size: clamp(.58rem, .72vw, .72rem); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); transition: background .3s, color .3s; white-space: nowrap; }
  .nav-group button:hover { background: rgba(24, 24, 24, .08); }
  .nav-group button.on { background: var(--ink); color: #fff; }
  .nav .cta { background: var(--red); color: #fff; }
  .nav .cta:hover { background: var(--ink); }

  /* ============ 5. VIEWS + REVEAL ============ */
  .view { position: absolute; inset: 0 0 var(--mq-h) 0; visibility: hidden; pointer-events: none; }
  .view.is-active, .view.is-leaving { visibility: visible; }
  .view.is-active { pointer-events: auto; }

  .rv { opacity: 0; transform: translateY(26px); transition: opacity .3s ease, transform .3s ease; }
  .is-active .rv {
    opacity: 1; transform: none;
    transition: opacity .9s ease calc(.2s + var(--i, 0) * .09s), transform 1s var(--ease) calc(.2s + var(--i, 0) * .09s);
  }

  .vl, .vr { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 4; display: flex; flex-direction: column; }
  .vl { left: 0; padding: 7rem var(--pad) 1.6rem; justify-content: space-between; gap: 1.4rem; }
  .vr { right: 0; padding: 6.5rem var(--pad) 1.6rem calc(var(--pad) * .8); justify-content: center; gap: 1.5rem; color: var(--ink); }
  .vl.end { justify-content: flex-end; align-items: flex-start; }
  .vr.end { justify-content: flex-end; align-items: flex-start; text-align: left; }
  .vr.start { justify-content: flex-start; align-items: flex-end; }

  /* ============ 6. TYPOGRAPHY ============ */
  .title, .hl { font-weight: 900; text-transform: uppercase; line-height: .88; letter-spacing: -.045em; }
  .title { font-size: min(8.2vw, 23vh); }
  .of { --c: #fff; color: var(--c); -webkit-text-stroke: 2px var(--c); animation: outfill var(--cycle) ease-in-out infinite; }
  @keyframes outfill { 0%, 12% { color: var(--c); } 44%, 56% { color: transparent; } 88%, 100% { color: var(--c); } }

  .eyebrow { font-size: .68rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--red); }
  .lead { font-size: clamp(.9rem, 1.35vw, 1.2rem); line-height: 1.6; font-weight: 500; max-width: 34em; }
  .lead.sm { font-size: .9rem; } .lead--w { color: rgba(255, 255, 255, .85); max-width: 26em; }
  .tag { font-size: clamp(.8rem, 1.1vw, 1rem); line-height: 1.5; font-weight: 600; }
  .note { max-width: 18vw; font-weight: 900; font-size: clamp(1.1rem, 1.9vw, 2rem); line-height: 1; text-transform: uppercase; letter-spacing: -.02em; }

  /* ============ 7. HERO ============ */
  .hero-center { position: absolute; left: 0; right: 0; top: 11%; }
  .hero-hl { position: relative; z-index: 1; }
  .hl { display: block; text-align: center; font-size: min(11vw, 21vh); }
  .hl i { display: block; font-style: normal; color: var(--c); -webkit-text-stroke: 2px var(--c); animation: outfill var(--cycle) ease-in-out infinite; }
  .hl i:nth-child(2) { animation-delay: calc(var(--cycle) / -2); }  /* baris kedua berlawanan fase */
  .hl--l, .s--l { --c: #fff; clip-path: inset(0 50% 0 0); }
  .hl--r, .s--r { --c: var(--ink); position: absolute; inset: 0 0 auto 0; clip-path: inset(0 0 0 50%); }

  .sub { position: relative; z-index: 3; margin-top: 1.4rem; text-align: left; font-weight: 500; text-transform: uppercase;
    font-size: clamp(.66rem, 1.05vw, 1rem); letter-spacing: .5em; padding-left: var(--pad); }
  .sub .s { display: block; color: #fff; }

  .char { position: absolute; z-index: 2; right: 3vw; bottom: 0; width: var(--cw); height: 72%; pointer-events: none; transition: transform .3s ease-out; }
  .char-img { width: 100%; height: 100%; object-fit: contain; object-position: bottom center; animation: float 6s ease-in-out infinite alternate;
    filter: drop-shadow(0 20px 40px rgba(0, 0, 0, .55)) drop-shadow(0 0 28px rgba(218, 41, 28, .35)); }
  @keyframes float { to { translate: 0 -1.6%; } }
  .view:not(.is-active) .char-img.rv { transform: translateY(9%); }   /* masuk dari bawah */

  /* Emblem besar di belakang teks nama (tengah): berputar pelan + glow */
  .emb { --es: min(104vh, 74vw); position: absolute; left: 50%; top: 50%; width: var(--es); height: var(--es); margin: calc(var(--es) / -2) 0 0 calc(var(--es) / -2); pointer-events: none; transition: transform .4s ease-out; }
  .emblem { width: 100%; height: 100%; }
  .view:not(.is-active) .emblem.rv { transform: scale(.55); }
  .emblem img { width: 100%; height: 100%; display: block; animation: spin 36s linear infinite, emb-glow 5s ease-in-out infinite alternate; }
  @keyframes emb-glow { from { filter: drop-shadow(0 0 24px rgba(218, 41, 28, .35)); } to { filter: drop-shadow(0 0 70px rgba(218, 41, 28, .85)); } }

  .hero-card { background: #fff; color: var(--ink); padding: 1.3rem 1.5rem; display: grid; gap: .9rem; max-width: calc(18vw + 3rem); box-shadow: 0 18px 50px rgba(0, 0, 0, .3); }
  .socials { display: flex; gap: .5rem; }
  .soc { width: 2.3rem; height: 2.3rem; border: 1px solid var(--ink); display: grid; place-items: center; font-size: .62rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; transition: background .3s, color .3s; }
  .soc:hover { background: var(--ink); color: #fff; }

  /* ============ 8. BUTTONS, CHIPS ============ */
  .btn { display: inline-block; align-self: flex-start; padding: .9rem 1.6rem; font-weight: 800; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; border: 1px solid currentColor; transition: background .3s, color .3s, border-color .3s; }
  .btn--light { background: #fff; color: var(--ink); border-color: #fff; } .btn--light:hover { background: var(--red); color: #fff; border-color: var(--red); }
  .btn--solid { background: var(--ink); color: #fff; border-color: var(--ink); } .btn--solid:hover { background: var(--red); border-color: var(--red); }
  .btn--ghost:hover { background: var(--ink); color: #fff; }
  .btns { display: flex; gap: .8rem; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip { padding: .45rem .85rem; border: 1px solid rgba(24, 24, 24, .35); font-size: .7rem; font-weight: 600; }

  /* ============ 9. ABOUT / WORK / SERVICES / CONTACT ============ */
  .stats { display: flex; gap: clamp(1.4rem, 3vw, 3rem); }
  .stats b { display: block; font-size: clamp(2rem, 4.4vw, 4.4rem); font-weight: 900; line-height: 1; letter-spacing: -.03em; }
  .stats span { font-size: .62rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; opacity: .7; }

  .wlist { list-style: none; display: grid; gap: .3rem; }
  .wlist button { display: flex; gap: .9rem; align-items: baseline; font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; font-size: clamp(1.1rem, 2.3vw, 2.2rem); color: #fff; opacity: .4; transition: opacity .3s, transform .4s var(--ease); text-align: left; }
  .wlist button em { font-style: normal; font-size: .6rem; letter-spacing: .1em; color: var(--red); }
  .wlist button:hover, .wlist button.on { opacity: 1; transform: translateX(8px); }

  .shot { position: relative; aspect-ratio: 16 / 10; background: linear-gradient(135deg, var(--dark), #5a0f0a 60%, var(--red)) center / cover; border: 1px solid rgba(24, 24, 24, .2); display: grid; place-items: center; overflow: hidden; }
  .shot span { font-weight: 900; text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; color: rgba(255, 255, 255, .85); }
  .proj { display: grid; gap: 1rem; transition: opacity .25s ease; }
  .proj h3 { font-size: 1.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; }

  .cards { position: absolute; z-index: 4; left: var(--pad); right: var(--pad); bottom: 1.6rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
  .card { padding: clamp(1rem, 1.8vw, 1.8rem); background: #fff; color: var(--ink); display: grid; gap: .7rem; align-content: start; }
  .card--2 { background: #222; color: #fff; border: 1px solid rgba(255, 255, 255, .16); } .card--3 { background: #efe6df; }
  .card em { font-style: normal; color: var(--red); font-weight: 800; font-size: .75rem; letter-spacing: .1em; }
  .card h3 { font-size: clamp(1rem, 1.7vw, 1.6rem); font-weight: 900; text-transform: uppercase; letter-spacing: -.02em; line-height: 1; }
  .card p { font-size: .78rem; line-height: 1.5; opacity: .75; }
  .card ul { list-style: none; display: grid; gap: .3rem; font-size: .78rem; font-weight: 600; }
  .card li::before { content: ""; display: inline-block; width: .4rem; height: .4rem; background: var(--red); margin-right: .6rem; }

  .links { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; margin-top: 1rem; }
  .links a { font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid transparent; transition: border-color .3s, color .3s; }
  .links a:hover { color: var(--red); border-color: var(--red); }
  .field { display: grid; gap: .5rem; font-size: .62rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; max-width: 30rem; }
  .field input, .field textarea { border-bottom: 1px solid var(--ink); padding: .6rem 0; font-size: .95rem; letter-spacing: 0; text-transform: none; font-weight: 500; resize: none; }
  .field input:focus, .field textarea:focus { border-color: var(--red); }

  /* ============ 10. MARQUEE ============ */
  .marquee { position: absolute; z-index: 60; left: 0; right: 0; bottom: 0; height: var(--mq-h); display: flex; align-items: center; overflow: hidden; background: var(--dark); border-top: 1px solid rgba(255, 255, 255, .14); user-select: none; }
  .mq-track { display: flex; width: max-content; animation: mq var(--speed) linear infinite; }
  .marquee:hover .mq-track { animation-play-state: paused; }
  .mq-group { display: flex; flex-shrink: 0; }
  .mq-item { display: inline-flex; align-items: center; font-weight: 500; font-size: clamp(.64rem, 1vw, .85rem); letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; }
  .mq-item::after { content: ""; width: .5em; height: .5em; margin: 0 2.2em; background: var(--red); transform: rotate(45deg); }
  @keyframes mq { to { transform: translateX(-50%); } }

  /* ============ 10b. LAYAR SEDANG (panel preview / tablet) ============ */
  @media (max-width: 900px) {
    :root { --cw: min(24vw, 40vh); }
    .hero-card { padding: 1rem 1.1rem; max-width: calc(15vw + 2rem); }
    .note { max-width: none; font-size: 1rem; }
    .soc { width: 2rem; height: 2rem; }
    .socials { gap: .4rem; }
  }

  /* ============ 11. MOBILE ============ */
  @media (max-width: 640px) {
    :root { --pad: 6vw; }
    .panel--l { width: 100%; height: 42%; } .panel--r { width: 100%; top: 42%; }
    .vl, .vr { width: 100%; }
    .vl { height: 42%; bottom: auto; padding-top: 4.8rem; }
    .vr, .vr.end { top: 42%; padding-top: 1.4rem; justify-content: flex-start; overflow-y: auto; align-items: stretch; text-align: left; }
    .logo { display: none; } .top { justify-content: center; } .nav { width: 100%; } .nav-group { flex: 1; overflow-x: auto; }
    .title { font-size: min(15vw, 13vh); }
    .char, .emb { display: none; }
    .hero-card { max-width: none; }
    .hero-center { top: 17%; } .hl { font-size: min(17vw, 12vh); }
    .hl--r { display: none; } .hl--l { clip-path: none; }
    .sub { letter-spacing: .4em; margin-top: .8rem; }
    .cards { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 78%; overflow-x: auto; bottom: .8rem; }
    .wlist button { font-size: 1.1rem; }
  }

  /* ============ 13. LOADER ============ */
  .loader { position: fixed; inset: 0; z-index: 1000; background: #090202; overflow: hidden; display: flex; justify-content: center; align-items: center; color: #fff;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
  .loader.is-exit { pointer-events: none; animation: ld-wipe .95s cubic-bezier(.7, 0, .2, 1) .35s forwards; }
  @keyframes ld-wipe { to { clip-path: polygon(140% 0, 100% 0, 100% 100%, 100% 100%); } }   /* sapuan diagonal */

  .ld-bg { position: absolute; inset: -10%; background: center / cover; filter: blur(30px) brightness(.38) saturate(1.3); animation: ld-fade 1.4s ease both; }
  @keyframes ld-fade { from { opacity: 0; } }

  .ld-poster { position: absolute; left: 50%; top: 46%; width: max(108vw, calc(106vh * 1307 / 736)); aspect-ratio: 1307 / 736; translate: -53% -46.2%; transform-origin: 53% 46.2%;
    animation: ld-in 1.3s var(--ease) both, ld-breathe 9s ease-in-out 1.3s infinite alternate; transition: transform 1.2s cubic-bezier(.6, 0, 1, .6), filter .5s; }
  @keyframes ld-in { from { opacity: 0; transform: scale(1.16); filter: brightness(.3); } }
  .is-exit .ld-poster { transform: scale(1.3); filter: brightness(1.8); }
  .ld-img { width: 100%; height: 100%; display: block; object-fit: cover; animation: ld-flicker 5.5s steps(1) infinite; }
  @keyframes ld-breathe { to { scale: 1.05; } }
  @keyframes ld-flicker { 0%, 100% { filter: none; } 7% { filter: brightness(1.7) contrast(1.2); } 8% { filter: brightness(.8); } 9% { filter: none; } 64% { filter: brightness(1.5) saturate(1.5); } 65% { filter: none; } }

  /* Mata (posisi mengikuti gambar): glow berdenyut + riak */
  .ld-eye { position: absolute; left: 53%; top: 46.2%; width: 30%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle, rgba(255, 40, 25, .85) 0%, rgba(255, 20, 10, .35) 35%, transparent 68%); animation: ld-eye 1.8s ease-in-out infinite alternate; }
  @keyframes ld-eye { from { opacity: .25; scale: .8; } to { opacity: 1; scale: 1.12; } }
  .ld-ripple { position: absolute; left: 53%; top: 46.2%; width: 9%; aspect-ratio: 1; translate: -50% -50%; border: 2px solid rgba(255, 60, 45, .9); border-radius: 50%; opacity: 0; pointer-events: none; animation: ld-ripple 2.4s ease-out infinite; }
  .ld-ring { position: absolute; left: 53%; top: 46.2%; width: 13%; aspect-ratio: 1; translate: -50% -50%; overflow: visible; pointer-events: none;
    filter: drop-shadow(0 0 6px #ff1208); animation: spin 14s linear infinite, ld-fade 1.4s ease .6s both; }
  .ld-ring circle { fill: none; stroke: rgba(255, 90, 70, .9); stroke-width: .7; stroke-dasharray: 6 4 1 4; }
  @keyframes ld-ripple { from { scale: .4; opacity: .9; } to { scale: 2.6; opacity: 0; } }

  .ld-scan { position: absolute; inset: 0; overflow: hidden; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .18) 0 1px, transparent 1px 3px); }
  .ld-scan::after { content: ""; position: absolute; left: 0; right: 0; height: 22%; background: linear-gradient(180deg, transparent, rgba(255, 40, 25, .22), transparent); animation: ld-scan 3.2s linear infinite; }
  @keyframes ld-scan { from { top: -25%; } to { top: 105%; } }

  /* Garis neon merah: tergambar satu per satu, lalu berdenyut */
  .ld-lines { position: absolute; left: -200%; top: -50%; width: 500%; height: 200%; overflow: visible; pointer-events: none;
    filter: drop-shadow(0 0 5px #ff2a1c) drop-shadow(0 0 16px #ff1208); animation: ld-neon 2.4s ease-in-out infinite alternate; }
  .ld-lines path { fill: none; stroke: #ff4a3c; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: ld-draw 1.1s var(--ease) both; transition: stroke .3s; }
  @keyframes ld-draw { from { stroke-dashoffset: 1; } }
  @keyframes ld-neon { from { opacity: .72; } to { opacity: 1; } }
  .is-done .ld-lines { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 22px #ff1208); }
  .is-done .ld-lines path { stroke: #fff; }

  .ld-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 35%, rgba(5, 0, 0, .82) 100%); }

  /* Teks */
  .ld-ui { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; transition: opacity .3s;
    padding: calc(clamp(1rem, 3vw, 2.4rem) + env(safe-area-inset-top, 0px)) clamp(1rem, 3vw, 2.4rem) calc(clamp(1rem, 3vw, 2.4rem) + env(safe-area-inset-bottom, 0px)); }
  .is-exit .ld-ui { opacity: 0; }
  .ld-ui { isolation: isolate; }
  .ld-ui::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;   /* scrim agar teks terbaca di atas poster terang */
    background: linear-gradient(180deg, rgba(0, 0, 0, .72), rgba(0, 0, 0, .18) 22%, rgba(0, 0, 0, .18) 46%, rgba(0, 0, 0, .88)); }
  .ld-rise { animation: ld-rise .9s var(--ease) var(--d, 0s) both; }
  @keyframes ld-rise { from { opacity: 0; transform: translateY(28px); } }
  .ld-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .ld-tag { font-size: .68rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; }
  .ld-tag::before { content: ""; display: inline-block; width: .5em; height: .5em; margin-right: 1em; background: var(--red); transform: rotate(45deg); }
  .ld-skip { pointer-events: auto; font-size: .66rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; border: 1px solid rgba(255, 255, 255, .4); padding: .7rem 1.1rem; transition: background .3s, color .3s; }
  .ld-skip:hover { background: #fff; color: var(--ink); }
  .ld-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 1.5rem; }
  .ld-name { display: block; font-weight: 900; text-transform: uppercase; line-height: .88; letter-spacing: -.045em; font-size: clamp(2.2rem, 8vw, 8.5rem); }
  .ld-count { display: flex; align-items: flex-start; font-weight: 900; line-height: .85; letter-spacing: -.05em; font-size: clamp(3.4rem, 13vw, 12rem); font-variant-numeric: tabular-nums; }
  .ld-count b { font-weight: 900; color: transparent; -webkit-text-stroke: 2px #fff; transition: color .4s; }
  .ld-count span { font-size: .32em; margin: .12em 0 0 .08em; color: var(--red); }
  .is-done .ld-count b { color: #fff; }
  .ld-foot { margin-top: 1.2rem; display: grid; gap: .8rem; }
  .ld-msg { font-size: .68rem; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; min-height: 1em; }
  .ld-msg::before { content: ""; display: inline-block; width: .5em; height: .5em; margin-right: 1em; background: var(--red); transform: rotate(45deg); }
  .ld-msg.swap { animation: ld-swap .5s var(--ease) both; }
  @keyframes ld-swap { from { opacity: 0; transform: translateY(8px); } }
  .ld-bar { height: 3px; background: rgba(255, 255, 255, .18); overflow: hidden; }
  .ld-bar i { display: block; height: 100%; background: var(--red); transform-origin: left; transform: scaleX(0); box-shadow: 0 0 14px var(--red); }

  @media (max-width: 640px) {
    .ld-bottom { flex-direction: column; align-items: flex-start; gap: .6rem; }
    .ld-name { font-size: clamp(2rem, 11vw, 3.4rem); } .ld-count { font-size: clamp(3rem, 20vw, 6rem); }
  }

  /* ============ 12. REDUCED MOTION ============ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .rv { opacity: 1; transform: none; }
  }
</style>
</head>

<body>
<div class="app" id="app">
  <div class="panel panel--l" aria-hidden="true"><div class="glow"></div></div>
  <div class="panel panel--r" aria-hidden="true"></div>

  <header class="top">
    <a class="logo" id="logo" href="#home" data-go="home" aria-label="Beranda"></a>
    <nav class="nav" id="nav" aria-label="Utama"></nav>
  </header>

  <main id="views"></main>

  <div class="marquee" role="marquee" aria-label="Keahlian"><div class="mq-track" id="mq"></div></div>
</div>

<script>
  /* =========================================================
     CONFIG — semua konten di sini. Ganti isinya saja.
     ========================================================= */
  const CONFIG = {
    name: "Muhammad Adilaga",
    nameLines: ["Muhammad", "Adilaga"],
    role: "Web & AI Developer",
    logoText: "MA",
    logoSrc: "",                            // logo kiri atas (berputar). Kosong = emblem tertanam
    emblemSrc: "",                          // lingkaran besar di belakang karakter. Kosong = emblem tertanam
    characterSrc: "",   // kosong = pakai gambar tertanam (lihat #assets). Isi path/URL untuk menggantinya
    availability: "Open to work",
    heroNote: "Fast web apps. Smart AI systems.",
    tagline: ["Code that works", "AI that ships"],
    cvHref: "#cv",
    loader: {
      src: "",                                  // kosong = gambar loader tertanam
      tag: "Portfolio — 2026",
      skip: "Skip ↗",
      minDuration: 2800,                        // ms, durasi minimum loading
      messages: ["Initializing", "Loading assets", "Compiling interface", "Awakening the eye"],
      doneMessage: "Ready — entering",
    },
    marquee: ["Web Development", "AI Systems", "Machine Learning", "REST API", "Open to Work"],
    socials: [
      { label: "WhatsApp",  href: "#" },
      { label: "GitHub",    href: "#" },
      { label: "Instagram", href: "#" },
      { label: "LinkedIn",  href: "#" },
    ],
    about: {
      text: "I’m a web and AI developer who builds clean, fast and responsive websites, from landing pages and dashboards to full web apps and intelligent systems. I care about details, smooth animations and code that is easy to maintain.",
      stats: [{ n: "4+", l: "Web projects" }, { n: "8", l: "Technologies" }, { n: "2", l: "Services" }],
      stack: ["HTML", "CSS", "JavaScript", "React", "Next.js", "Python", "REST API", "Machine Learning"],
    },
    projects: [
      { name: "Project One",   desc: "Short description of the first project and the problem it solves.", tags: ["Next.js", "API"],    link: "#", image: "" },
      { name: "Project Two",   desc: "Short description of the second project and what you built.",       tags: ["React", "Python"],  link: "#", image: "" },
      { name: "Project Three", desc: "Short description of the third project and its results.",           tags: ["ML", "Dashboard"],  link: "#", image: "" },
      { name: "Project Four",  desc: "Short description of the fourth project and your role.",            tags: ["REST API", "SQL"],  link: "#", image: "" },
    ],
    services: [
      { title: "Web Development", desc: "Clean, fast websites that make your business look professional.", points: ["Landing Pages", "Company Profiles", "Dashboards", "Web Apps"] },
      { title: "AI Integration",  desc: "Practical AI features that fit smoothly into your product.",       points: ["Chatbots", "Data Pipelines", "ML Models", "Automation"] },
      { title: "REST API",        desc: "Reliable, well-documented backends your apps can build on.",       points: ["API Design", "Auth", "Databases", "Deployment"] },
    ],
    contact: {
      text: "Have a project in mind? Send me a message and let’s build it together.",
      whatsapp: "6281234567890",   // format internasional tanpa +
    },
  };

  /* =========================================================
     HELPERS
     ========================================================= */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rv = (i, cls = "") => `class="${cls} rv" style="--i:${i}"`;
  const num = (i) => String(i + 1).padStart(2, "0");
  const socials = (c) => c.socials.map((s) => `<a class="soc" href="${esc(s.href)}" aria-label="${esc(s.label)}" target="_blank" rel="noopener">${esc(s.label.slice(0, 2))}</a>`).join("");
  const chips = (arr) => arr.map((t) => `<span class="chip">${esc(t)}</span>`).join("");

  /* =========================================================
     VIEW TEMPLATES
     ========================================================= */
  const VIEWS = {
    home: (c) => `
      <section class="view" id="v-home" aria-label="Home">
        ${c.emblemSrc ? `<div class="emb" id="emb" aria-hidden="true"><div class="emblem rv" style="--i:0"><img src="${esc(c.emblemSrc)}" alt=""></div></div>` : ""}
        <div class="hero-center">
          <h1 class="hero-hl rv" style="--i:0" aria-label="${esc(c.name)}">
            ${["l", "r"].map((s) => `<span class="hl hl--${s}" aria-hidden="true">${c.nameLines.map((t) => `<i>${esc(t)}</i>`).join("")}</span>`).join("")}
          </h1>
          <p class="sub rv" style="--i:2" aria-label="${esc(c.role)}">
            <span class="s" aria-hidden="true">${esc(c.role)}</span>
          </p>
        </div>
        <div class="char" id="char"><img class="char-img rv" style="--i:1" id="charImg" alt="" hidden></div>
        <div class="vl end">
          <p ${rv(3, "tag")}>${c.tagline.map(esc).join("<br>")}</p>
          <a ${rv(4, "btn btn--light")} href="#work" data-go="work">View Work ↗</a>
        </div>
        <div class="vr end">
          <div ${rv(3, "hero-card")}>
            <p class="eyebrow">${esc(c.availability)}</p>
            <p class="note">${esc(c.heroNote)}</p>
            <div class="socials">${socials(c)}</div>
          </div>
        </div>
      </section>`,

    about: (c) => `
      <section class="view" id="v-about" aria-label="About">
        <div class="vl">
          <h2 class="title of rv" style="--i:0">About</h2>
          <div class="stats rv" style="--i:2">${c.about.stats.map((s) => `<div><b>${esc(s.n)}</b><span>${esc(s.l)}</span></div>`).join("")}</div>
        </div>
        <div class="vr">
          <p ${rv(1, "eyebrow")}>Who I am</p>
          <p ${rv(2, "lead")}>${esc(c.about.text)}</p>
          <p ${rv(3, "eyebrow")}>Tech stack</p>
          <div ${rv(4, "chips")}>${chips(c.about.stack)}</div>
          <div ${rv(5, "btns")}>
            <a class="btn btn--solid" href="${esc(c.cvHref)}" download>Download CV ↓</a>
            <a class="btn btn--ghost" href="#contact" data-go="contact">Let’s Talk ↗</a>
          </div>
        </div>
      </section>`,

    work: (c) => `
      <section class="view" id="v-work" aria-label="Work">
        <div class="vl">
          <h2 class="title of rv" style="--i:0">Work</h2>
          <ol class="wlist rv" style="--i:2">${c.projects.map((p, i) => `<li><button data-proj="${i}" class="${i ? "" : "on"}"><em>${num(i)}</em>${esc(p.name)}</button></li>`).join("")}</ol>
        </div>
        <div class="vr"><div class="proj rv" style="--i:1" id="proj">${projectHTML(c.projects[0])}</div></div>
      </section>`,

    services: (c) => `
      <section class="view" id="v-services" aria-label="Services">
        <div class="vl"><h2 class="title of rv" style="--i:0">Services</h2></div>
        <div class="vr start"><p ${rv(1, "eyebrow")}>What I can do for you</p></div>
        <div class="cards">${c.services.map((s, i) => `
          <article class="card card--${i + 1} rv" style="--i:${i + 2}">
            <em>${num(i)}</em><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p>
            <ul>${s.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
          </article>`).join("")}</div>
      </section>`,

    contact: (c) => `
      <section class="view" id="v-contact" aria-label="Contact">
        <div class="vl">
          <h2 class="title of rv" style="--i:0">Let’s<br>Talk</h2>
          <div>
            <p ${rv(2, "lead lead--w")}>${esc(c.contact.text)}</p>
            <div ${rv(3, "links")}>${c.socials.map((s) => `<a href="${esc(s.href)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("")}</div>
          </div>
        </div>
        <form class="vr" id="form" autocomplete="off">
          <p ${rv(1, "eyebrow")}>Send a message</p>
          <label ${rv(2, "field")}>Your name<input id="fName" type="text" placeholder="John Doe"></label>
          <label ${rv(3, "field")}>Your message<textarea id="fMsg" rows="4" placeholder="Tell me about your project…"></textarea></label>
          <button ${rv(4, "btn btn--solid")} type="submit">Send via WhatsApp ↗</button>
        </form>
      </section>`,
  };

  function projectHTML(p) {
    return `
      <div class="shot" ${p.image ? `style="background-image:url('${esc(p.image)}')"` : ""}><span>${esc(p.name)}</span></div>
      <h3>${esc(p.name)}</h3>
      <p class="lead sm">${esc(p.desc)}</p>
      <div class="chips">${chips(p.tags)}</div>
      <a class="btn btn--solid" href="${esc(p.link)}" target="_blank" rel="noopener">View Project ↗</a>`;
  }

  /* =========================================================
     MOUNT
     ========================================================= */
  const IDS = Object.keys(VIEWS);
  const NAV_LABELS = { home: "Home", about: "About", work: "Work", services: "Services", contact: "Contact" };

  function mount(c) {
    const logo = $("#logo");
    const logoText = () => { logo.classList.add("txt"); logo.textContent = c.logoText; };
    if (c.logoSrc) {
      const img = new Image();
      img.alt = ""; img.onerror = logoText; img.src = c.logoSrc;
      logo.replaceChildren(img);
    } else logoText();
    $("#views").innerHTML = IDS.map((id) => VIEWS[id](c)).join("");

    $("#nav").innerHTML = `
      <div class="nav-group">${IDS.map((id) => `<button data-go="${id}">${NAV_LABELS[id]}</button>`).join("")}</div>
      <button class="cta" data-go="contact">Let’s Talk ↗</button>`;

    const group = (g) => `<div class="mq-group"${g ? ' aria-hidden="true"' : ""}>${[...c.marquee, ...c.marquee].map((t) => `<span class="mq-item">${esc(t)}</span>`).join("")}</div>`;
    $("#mq").innerHTML = group(0) + group(1);   // dua group identik → loop -50% mulus
  }

  /* =========================================================
     ROUTER
     ========================================================= */
  let current = null;

  function show(id) {
    if (!IDS.includes(id)) id = "home";
    if (id === current) return;
    const prev = current && $("#v-" + current);
    if (prev) {
      prev.classList.remove("is-active");
      prev.classList.add("is-leaving");
      setTimeout(() => prev.classList.remove("is-leaving"), 450);
    }
    $("#v-" + id).classList.add("is-active");
    current = id;
    $$(".nav-group [data-go]").forEach((b) => b.classList.toggle("on", b.dataset.go === id));
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* iframe preview */ }
  }

  function initRouter() {
    document.addEventListener("click", (e) => {
      const t = e.target.closest("[data-go]");
      if (!t) return;
      e.preventDefault();
      show(t.dataset.go);
    });
    addEventListener("keydown", (e) => {
      if (e.target.closest("input, textarea")) return;
      const i = IDS.indexOf(current);
      if (e.key === "ArrowRight") show(IDS[Math.min(i + 1, IDS.length - 1)]);
      if (e.key === "ArrowLeft")  show(IDS[Math.max(i - 1, 0)]);
    });
    addEventListener("hashchange", () => show(location.hash.slice(1)));
    // show() pertama dipanggil setelah loader selesai (lihat INIT)
  }

  /* =========================================================
     FEATURES
     ========================================================= */
  function initCharacter(src) {
    if (!src) return;
    const probe = new Image();
    probe.onload = () => { const img = $("#charImg"); img.src = src; img.hidden = false; };
    probe.src = src;    // file tidak ada → halaman tetap utuh tanpa karakter
  }

  function initParallax() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const char = $("#char"), emb = $("#emb");
    addEventListener("pointermove", (e) => {
      const x = (e.clientX / innerWidth - .5) * 2, y = (e.clientY / innerHeight - .5) * 2;
      char.style.transform = `translate3d(${x * 22}px, ${y * 10}px, 0)`;
      if (emb) emb.style.transform = `translate3d(${x * -16}px, ${y * -8}px, 0)`;   // arah berlawanan → kesan kedalaman
    }, { passive: true });
  }

  function initWork(c) {
    const box = $("#proj");
    $$("[data-proj]").forEach((btn) => btn.addEventListener("click", () => {
      $$("[data-proj]").forEach((b) => b.classList.toggle("on", b === btn));
      box.style.opacity = 0;
      setTimeout(() => { box.innerHTML = projectHTML(c.projects[Number(btn.dataset.proj)]); box.style.opacity = ""; }, 220);
    }));
    $$("[data-proj]").forEach((btn) => btn.addEventListener("mouseenter", () => btn.click()));
  }

  function initForm(c) {
    $("#form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("#fName").value.trim(), msg = $("#fMsg").value.trim();
      const text = encodeURIComponent(`Halo, saya ${name || "-"}. ${msg}`);
      window.open(`https://wa.me/${c.contact.whatsapp}?text=${text}`, "_blank", "noopener");
    });
  }

  /* =========================================================
     INIT
     ========================================================= */
  /* =========================================================
     LOADER (tampil sebelum masuk ke portfolio)
     ========================================================= */
  const LOADER_LINES = [   // koordinat mengikuti gambar loader 1307×736, sengaja melewati tepi
    "M-2000 744 L3300 -422",    // garis datar atas
    "M-2000 1114 L3300 -31",    // garis datar bawah
    "M424 -400 L90 1150",       // garis miring kiri
    "M1213 -400 L872 1150",     // garis miring kanan
  ];

  function mountLoader(c) {
    const L = c.loader;
    const el = document.createElement("div");
    el.className = "loader";
    el.setAttribute("role", "status");
    el.setAttribute("aria-label", "Memuat portfolio");
    el.innerHTML = `
      <div class="ld-bg"></div>
      <div class="ld-poster">
        ${L.src ? `<img class="ld-img" alt="">` : ""}
        <i class="ld-eye"></i><i class="ld-ripple"></i><i class="ld-ripple" style="animation-delay:1.2s"></i>
        <svg class="ld-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48"/></svg>
        <svg class="ld-lines" viewBox="-2614 -368 6535 1472" preserveAspectRatio="none" aria-hidden="true">
          ${LOADER_LINES.map((d, i) => `<path d="${d}" pathLength="1" style="animation-delay:${i * 0.15}s"/>`).join("")}
        </svg>
      </div>
      <div class="ld-scan"></div>
      <div class="ld-ui">
        <div class="ld-top">
          <p class="ld-tag ld-rise" style="--d:.2s">${esc(L.tag)}</p>
          <button class="ld-skip ld-rise" style="--d:.3s" id="ldSkip" type="button">${esc(L.skip)}</button>
        </div>
        <div>
          <div class="ld-bottom">
            <h2 class="ld-rise" style="--d:.5s" aria-hidden="true"><span class="ld-name of">${c.nameLines.map(esc).join("<br>")}</span></h2>
            <p class="ld-count ld-rise" style="--d:.7s" aria-hidden="true"><b id="ldNum">000</b><span>%</span></p>
          </div>
          <div class="ld-foot ld-rise" style="--d:.9s">
            <p class="ld-msg" id="ldMsg"></p>
            <div class="ld-bar"><i id="ldBar"></i></div>
          </div>
        </div>
      </div>`;
    if (L.src) {
      $(".ld-bg", el).style.backgroundImage = `url("${L.src}")`;
      $(".ld-img", el).src = L.src;
    }
    document.body.appendChild(el);
    return el;
  }

  // Resolve saat loader mulai keluar → situs mulai tampil sambil sapuan berjalan
  function runLoader(c) {
    const L = c.loader, el = mountLoader(c);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const num = $("#ldNum", el), bar = $("#ldBar", el), msg = $("#ldMsg", el);
    const minTime = reduce ? 500 : L.minDuration;

    // aset yang benar-benar ditunggu (maks. 7 detik)
    const decode = (src) => src ? new Promise((res) => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }) : null;
    const waits = [document.fonts && document.fonts.ready, decode(L.src), decode(c.characterSrc), decode(c.emblemSrc)].filter(Boolean);
    let ready = false;
    Promise.race([Promise.all(waits), new Promise((r) => setTimeout(r, 7000))]).then(() => { ready = true; });

    return new Promise((resolve) => {
      let shown = 0, msgIdx = -1, done = false, raf = 0;
      const t0 = performance.now();

      const finish = () => {
        if (done) return;
        done = true;
        cancelAnimationFrame(raf);
        num.textContent = "100";
        bar.style.transform = "scaleX(1)";
        msg.textContent = L.doneMessage;
        el.classList.add("is-done");
        setTimeout(() => {
          el.classList.add("is-exit");
          setTimeout(resolve, reduce ? 0 : 450);
          setTimeout(() => el.remove(), reduce ? 80 : 1500);
        }, reduce ? 0 : 550);
      };

      const tick = (now) => {
        const t = Math.min((now - t0) / minTime, 1);
        const eased = 1 - Math.pow(1 - t, 2.2);                       // melambat di akhir
        const target = ready ? eased * 100 : Math.min(eased * 100, 92); // tahan di 92% sampai aset siap
        shown += (target - shown) * 0.12;
        if (t >= 1 && ready && shown > 99.5) shown = 100;

        num.textContent = String(Math.round(shown)).padStart(3, "0");
        bar.style.transform = `scaleX(${shown / 100})`;

        const i = Math.min(L.messages.length - 1, Math.floor(shown / (100 / L.messages.length)));
        if (i !== msgIdx) {
          msgIdx = i;
          msg.textContent = L.messages[i];
          msg.classList.remove("swap"); void msg.offsetWidth; msg.classList.add("swap");
        }
        if (shown >= 100) return finish();
        raf = requestAnimationFrame(tick);
      };

      $("#ldSkip", el).addEventListener("click", finish);
      addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter") finish(); });
      raf = requestAnimationFrame(tick);
    });
  }

  // Gambar tertanam (base64) dibaca dari <script id="assets"> di akhir file
  function loadAssets(c) {
    let img = {};
    try { img = JSON.parse($("#assets").textContent); } catch (e) { /* tanpa gambar tertanam */ }
    c.characterSrc = c.characterSrc || img.character || "";
    c.logoSrc      = c.logoSrc      || img.emblem    || "";
    c.emblemSrc    = c.emblemSrc    || img.emblem    || "";
    c.loader.src   = c.loader.src   || img.loader    || "";
  }

  document.addEventListener("DOMContentLoaded", () => {
    loadAssets(CONFIG);
    mount(CONFIG);
    initCharacter(CONFIG.characterSrc);
    initParallax();
    initWork(CONFIG);
    initForm(CONFIG);
    initRouter();
    runLoader(CONFIG).then(() => requestAnimationFrame(() => requestAnimationFrame(() => show(location.hash.slice(1) || "home"))));
  });
